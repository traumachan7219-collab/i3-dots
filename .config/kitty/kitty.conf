# --- Fonts & Typography ---
font_family      DejaVuSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Performance tweaks for crisp font rendering
disable_ligatures transparent
box_drawing_scale 0.001, 1, 1.5, 1

# --- Window Layout & Padding ---
window_padding_width  14
remember_window_size  no
initial_width         950
initial_height        600
hide_window_decorations yes

# --- Window Transparency & Blur ---
background_opacity         0.54
dynamic_background_opacity yes

# --- Smooth Cursor Configuration ---
cursor                #f5c2e7
cursor_text_color     #1e1e2e
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# --- Terminal Performance & Bell Settings ---
repaint_delay    8
input_delay      2
sync_to_monitor  yes
enable_audio_bell no
window_alert_on_bell no

# --- Color Palette ---
background #1e1e2e
foreground #cdd6f4
bold_color #f5c2e7
selection_background  #f5c2e7
selection_foreground  #ffffff

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #cdd6f4

# --- Mouse & Selection Behavior ---
url_color        #94e2d5
url_style        curly
open_url_with    default
detect_urls      yes
copy_on_select   yes

# ==========================================================================
#                         QUALITY OF LIFE SHORTCUTS
# ==========================================================================
# Quick Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font scaling on the fly
map ctrl+equal     change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+kp_0      change_font_size all 0

# URL clicking shortcut
map ctrl+left click ungrabbed no_op
