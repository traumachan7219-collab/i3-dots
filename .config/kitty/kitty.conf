# --- Fonts & Typography ---
font_family      DejaVuSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Performance tweaks for crisp font rendering
disable_ligatures transparent
box_drawing_scale 0.001, 1, 1.5, 1

# --- Window Layout & Padding ---
window_padding_width  14
remember_window_size  no
initial_width         950
initial_height        600
hide_window_decorations yes

# --- Window Transparency & Blur ---
background_opacity         0.54
dynamic_background_opacity yes

# --- Smooth Cursor Configuration ---
cursor                #7aa2f7
cursor_text_color     #24283b
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# --- Terminal Performance & Bell Settings ---
repaint_delay    8
input_delay      2
sync_to_monitor  yes
enable_audio_bell no
window_alert_on_bell no

# --- Color Palette ---
background #24283b
foreground #c0caf5
bold_color #7aa2f7
selection_background  #7aa2f7
selection_foreground  #ffffff

# Black
color0  #24283b
color8  #414868

# Red
color1  #f7768e
color9  #ff7a93

# Green
color2  #9ece6a
color10 #b9f27c

# Yellow
color3  #e0af68
color11 #ff9e64

# Blue
color4  #7aa2f7
color12 #7da6ff

# Magenta
color5  #bb9af7
color13 #c0a0ff

# Cyan
color6  #7dcfff
color14 #89ddff

# White
color7  #a9b1d6
color15 #c0caf5

# --- Mouse & Selection Behavior ---
url_color        #7dcfff
url_style        curly
open_url_with    default
detect_urls      yes
copy_on_select   yes

# ==========================================================================
#                         QUALITY OF LIFE SHORTCUTS
# ==========================================================================
# Quick Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font scaling on the fly
map ctrl+equal     change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+kp_0      change_font_size all 0

# URL clicking shortcut
map ctrl+left click ungrabbed no_op
