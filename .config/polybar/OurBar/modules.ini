[module/workspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
icon-0 = 1; 1
icon-1 = 2; 2
icon-2 = 3; 3
icon-3 = 4; 4
icon-4 = 5; 5
icon-5 = 6; 6
icon-6 = 7; 7
icon-7 = 8; 8
icon-8 = 9; 9
icon-default = 9
format = <label-state>
label-active = %icon%
label-active-foreground = ${color.primary}
label-active-background = ${color.background}
label-active-padding = 2
label-occupied = %icon%
label-occupied-foreground = ${color.foreground}
label-occupied-padding = 2
label-urgent = %icon%
label-urgent-foreground = ${color.secondary}
label-urgent-padding = 2
label-empty = %icon%
label-empty-foreground = ${color.foreground-alt}
label-empty-padding = 2

[module/quote]
type = custom/script
exec = ~/.config/polybar/OurBar/quotes.sh
interval = 300
format = <label>
label = %output%
label-foreground = ${color.foreground}
click-left = ~/.config/polybar/OurBar/quote-source.sh

[module/gap]
type = custom/text
content = |

[module/icon]
type = custom/text
format = <label>
label = 
label-foreground = ${color.primary}
label-background = ${color.background}
label-padding = 2


[module/date]
type = internal/date
interval = 1.0
date = %a %d %b
time = %I:%M %p
format = <label>
label = %time%  %date%

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume>  <label-volume>
format-volume-prefix = " "
format-muted = <label-muted>
format-muted-prefix = " "
label-volume = %percentage%%
label-muted =  Muted
label-muted-foreground = ${color.foreground-alt}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
 
[module/tray]
type = internal/tray
tray-spacing = 4

[module/wired-network]
type = internal/network
interface = eth0

[module/wireless-network]
type = internal/network
interface = wlp3s0

[module/network]
type = internal/network
interface = enp3s0

interval = 1.0

accumulate-stats = true

unknown-as-up = true

format-connected = <label-connected>
format-connected-prefix = 

format-disconnected = <label-disconnected>
format-disconnected-prefix = 

label-connected = "%{A1:networkmanager_dmenu &:} 󰖩  Connected%{A}"
label-connected-foreground = ${color.foreground}

label-disconnected = "%{A1:networkmanager_dmenu &:}󰖪 Disconnected%{A}"
label-disconnected-foreground = ${color.foreground-alt}

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 

