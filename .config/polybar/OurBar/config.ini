[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/OurBar/colors.ini
include-file = ~/.config/polybar/OurBar/modules.ini

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true
width = 100%
height = 28
offset-x = 0%
offset-y = 0%
background = ${color.background}
foreground = ${color.foreground}
radius-top = 0
radius-bottom = 0
border-left-size = 1
border-left-color = ${color.primary}
border-right-size = 1
border-right-color = ${color.primary}
border-top-size = 1
border-top-color = ${color.primary}
border-bottom-size = 1
border-bottom-color = ${color.primary}
padding = 0
module-margin-left = 1
module-margin-right = 1
enable-ipc = true
font-0 = "DejaVuSansM Nerd Font:size=12;3"
modules-left = icon workspaces gap
modules-center = quote quote-timer
modules-right = gap network volume date
separator =
